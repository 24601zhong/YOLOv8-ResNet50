# ============================================================
# YOLOv8 改进网络配置 yolov8_mix_bifpn.yaml
# Backbone: MixConv 混合深度卷积替换浅层卷积
# Neck: 标准 PAN-FPN（BiFPN 加权融合通过训练时注入）
# Head: 保留原生 YOLOv8 Anchor-Free 解耦检测头
# ============================================================

# 参数
nc: 1                     # 类别数（仅 person）
scales:
  # 模型缩放配置
  n: [0.33, 0.25, 2.0]    # depth, width, max_channels
  s: [0.33, 0.50, 2.0]
  m: [0.67, 0.75, 1.5]
  l: [1.00, 1.00, 1.0]
  x: [1.00, 1.25, 1.0]

# ============================================================
# Backbone（MixConv 混合深度卷积）
# 替换前两个标准 Conv 为 MixConv，降低参数量
# ============================================================
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                  # 0-P1/2
  - [-1, 1, MixConv2d, [128, [3, 5, 7]]]       # 1-P2/4 (MixConv)
  - [-1, 1, C2f, [128, True]]                    # 2
  - [-1, 1, MixConv2d, [256, [3, 5, 7]]]       # 3-P3/8 (MixConv)
  - [-1, 2, C2f, [256, True]]                    # 4
  - [-1, 1, Conv, [512, 3, 2]]                  # 5-P4/16
  - [-1, 2, C2f, [512, True]]                    # 6
  - [-1, 1, Conv, [1024, 3, 2]]                 # 7-P5/32
  - [-1, 1, C2f, [1024, True]]                   # 8
  - [-1, 1, SPPF, [1024, 5]]                     # 9

# ============================================================
# Head（标准 PAN-FPN Neck + YOLOv8 解耦检测头）
# ============================================================
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]                    # 11 cat P4
  - [-1, 1, C2f, [512]]                          # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4], 1, Concat, [1]]                    # 14 cat P3
  - [-1, 1, C2f, [256]]                          # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                   # 16
  - [[-1, 12], 1, Concat, [1]]                   # 17 cat
  - [-1, 1, C2f, [512]]                          # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                   # 19
  - [[-1, 9], 1, Concat, [1]]                    # 20 cat
  - [-1, 1, C2f, [1024]]                         # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]]              # 22 Detect(P3, P4, P5)
